name: Debian 12 Core 2 xterm builds

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "patches/**"
      - "scripts/**"
      - "README.md"
      - "info.txt"
      - "TESTING.md"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "patches/**"
      - "scripts/**"
      - "README.md"
      - "info.txt"
      - "TESTING.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:12
    strategy:
      fail-fast: false
      matrix:
        include:
          - patch: "379"
            label: "bookworm-xterm-379"
          - patch: "412"
            label: "stable-xterm-412"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build xterm source variant
        run: ./scripts/build-debian12.sh "${{ matrix.patch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.label }}-core2-debian12"
          path: "build/out/${{ matrix.patch }}/*.deb"
          if-no-files-found: error
